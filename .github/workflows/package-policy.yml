name: Unity package policy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  package-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate package boundary and inputs
        shell: pwsh
        run: ./Tools~/Repository/Test-Package.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test self-authored ECS
        run: dotnet test Tools~/Ecs/EjoyFramework.Core.Ecs.Tests.csproj --configuration Release
